name: Daily Stock Tracker Update

on:
  schedule:
    # Runs at 10:00 AM EST (15:00 UTC) and 5:00 PM EST (22:00 UTC) Monday through Friday
    - cron: '0 15,22 * * 1-5'
  workflow_dispatch: # Keeps manual trigger active anytime
  
jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Tracker Script
        run: python portfolio_tracker.py
